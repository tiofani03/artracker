<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0E121B" />
      <stop offset="100%" stop-color="#090C12" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7528" />
      <stop offset="50%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#D93800" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF782E" stop-opacity="0.05" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#FF5500" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="680" fill="url(#bgGrad)" />

  <!-- Grid Pattern -->
  <g opacity="0.08">
    <path d="M0 68 H1200 M0 136 H1200 M0 204 H1200 M0 272 H1200 M0 340 H1200 M0 408 H1200 M0 476 H1200 M0 544 H1200 M0 612 H1200" stroke="#FFFFFF" stroke-width="1" />
    <path d="M120 0 V680 M240 0 V680 M360 0 V680 M480 0 V680 M600 0 V680 M720 0 V680 M840 0 V680 M960 0 V680 M1080 0 V680" stroke="#FFFFFF" stroke-width="1" />
  </g>

  <!-- Ambient Glow -->
  <circle cx="600" cy="180" r="280" fill="#FF5500" opacity="0.12" filter="blur(60px)" />

  <!-- Window Frame -->
  <rect x="50" y="40" width="1100" height="600" rx="16" fill="#0C1018" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" filter="url(#cardShadow)" />
  
  <!-- Window Header -->
  <rect x="50" y="40" width="1100" height="48" rx="16" fill="#111622" />
  <rect x="50" y="72" width="1100" height="16" fill="#111622" />
  <line x1="50" y1="88" x2="1150" y2="88" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="76" cy="64" r="6" fill="#FF5F56" />
  <circle cx="96" cy="64" r="6" fill="#FFBD2E" />
  <circle cx="116" cy="64" r="6" fill="#27C93F" />

  <!-- Address Bar -->
  <rect x="360" y="52" width="480" height="24" rx="6" fill="#080A0F" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="600" y="68" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11" text-anchor="middle" font-weight="500">https://artracker.exlm.my.id</text>

  <!-- Navbar inside Window -->
  <g transform="translate(80, 108)">
    <!-- Logo -->
    <rect x="0" y="0" width="28" height="28" rx="6" fill="url(#orangeGrad)" />
    <path d="M7 21 L14 7 L21 21 M9 16 L19 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <text x="36" y="20" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="16" font-weight="800">AR<tspan fill="#FF5500">Tracker</tspan></text>

    <!-- Nav Items -->
    <text x="500" y="19" fill="#9DA8BA" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Features</text>
    <text x="590" y="19" fill="#9DA8BA" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Session Replay</text>
    <text x="720" y="19" fill="#9DA8BA" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">SDKs</text>
    <text x="790" y="19" fill="#9DA8BA" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Simulator</text>

    <!-- CTA Button -->
    <rect x="910" y="-2" width="130" height="32" rx="6" fill="url(#orangeGrad)" />
    <text x="975" y="19" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Start Free (SSO)</text>
  </g>

  <!-- Hero Content inside Mockup -->
  <g transform="translate(600, 205)" text-anchor="middle">
    <!-- Badge -->
    <rect x="-140" y="-14" width="280" height="28" rx="14" fill="rgba(255, 85, 0, 0.12)" stroke="rgba(255, 85, 0, 0.35)" />
    <circle cx="-118" cy="0" r="4" fill="#FF5500" />
    <text x="8" y="5" fill="#FF782E" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">NEXT-GEN UNIFIED OBSERVABILITY</text>

    <!-- Main Title -->
    <text x="0" y="55" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      See Every Click. Diagnose Every Crash.
    </text>
    <text x="0" y="95" fill="url(#orangeGrad)" font-family="-apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Understand Every User.
    </text>

    <!-- Subtitle -->
    <text x="0" y="132" fill="#9DA8BA" font-family="-apple-system, sans-serif" font-size="14" font-weight="400">
      Open-Source alternative to OpenReplay, Sentry, and Mixpanel — in one electric-speed engine.
    </text>
  </g>

  <!-- 6 Pillars Cards Row in Preview -->
  <g transform="translate(80, 395)">
    <!-- 1. SSO -->
    <rect x="0" y="0" width="160" height="190" rx="10" fill="#141926" stroke="rgba(255,255,255,0.08)" />
    <rect x="14" y="14" width="32" height="32" rx="6" fill="rgba(255,85,0,0.12)" />
    <text x="14" y="70" fill="#FF5500" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">IDENTITY</text>
    <text x="14" y="90" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">SSO Login</text>
    <text x="14" y="112" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">Google, SAML,</text>
    <text x="14" y="128" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">GitHub &amp; Okta.</text>

    <!-- 2. Replay -->
    <rect x="175" y="0" width="160" height="190" rx="10" fill="#141926" stroke="#FF5500" stroke-width="1.5" />
    <rect x="189" y="14" width="32" height="32" rx="6" fill="url(#orangeGrad)" />
    <text x="189" y="70" fill="#FF5500" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">OPENREPLAY</text>
    <text x="189" y="90" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Session Replay</text>
    <text x="189" y="112" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">DOM snapshots &amp;</text>
    <text x="189" y="128" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">rage clicks.</text>

    <!-- 3. Dev Log -->
    <rect x="350" y="0" width="160" height="190" rx="10" fill="#141926" stroke="rgba(255,255,255,0.08)" />
    <rect x="364" y="14" width="32" height="32" rx="6" fill="rgba(255,85,0,0.12)" />
    <text x="364" y="70" fill="#FF5500" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">SENTRY-GRADE</text>
    <text x="364" y="90" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Event Log</text>
    <text x="364" y="112" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">Stack traces &amp;</text>
    <text x="364" y="128" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">source maps.</text>

    <!-- 4. Tracker -->
    <rect x="525" y="0" width="160" height="190" rx="10" fill="#141926" stroke="rgba(255,255,255,0.08)" />
    <rect x="539" y="14" width="32" height="32" rx="6" fill="rgba(255,85,0,0.12)" />
    <text x="539" y="70" fill="#FF5500" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">MARKETING</text>
    <text x="539" y="90" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Event Tracker</text>
    <text x="539" y="112" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">Funnels, cohorts</text>
    <text x="539" y="128" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">&amp; attribution.</text>

    <!-- 5. Dashboard -->
    <rect x="700" y="0" width="160" height="190" rx="10" fill="#141926" stroke="rgba(255,255,255,0.08)" />
    <rect x="714" y="14" width="32" height="32" rx="6" fill="rgba(255,85,0,0.12)" />
    <text x="714" y="70" fill="#FF5500" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">MONITORING</text>
    <text x="714" y="90" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Dashboard</text>
    <text x="714" y="112" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">Real-time charts &amp;</text>
    <text x="714" y="128" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">p95 latencies.</text>

    <!-- 6. Alerts -->
    <rect x="875" y="0" width="160" height="190" rx="10" fill="#141926" stroke="rgba(255,255,255,0.08)" />
    <rect x="889" y="14" width="32" height="32" rx="6" fill="rgba(255,85,0,0.12)" />
    <text x="889" y="70" fill="#FF5500" font-family="-apple-system, sans-serif" font-size="10" font-weight="800">AUTOMATION</text>
    <text x="889" y="90" fill="#FFFFFF" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Custom Alerts</text>
    <text x="889" y="112" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">Telegram &amp; Slack</text>
    <text x="889" y="128" fill="#8E9BAE" font-family="-apple-system, sans-serif" font-size="11">instant triggers.</text>
  </g>
</svg>
