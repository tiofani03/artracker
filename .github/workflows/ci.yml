name: ci

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-visual-check:
    name: Verify PR Visual Evidence (PNG/WebP/JPG Required)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR description contains raster image (PNG, WebP, JPG)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "=== Checking PR description for PNG/WebP/JPG screenshot attachment ==="
          python3 -c "
          import os, re, sys
          body = os.environ.get('PR_BODY', '')
          # Match markdown/html images with png, webp, jpg, jpeg extensions or github user-attachment uploads
          pattern = re.compile(
              r'(!\[.*?\]\(.*?\.(png|webp|jpg|jpeg)(\?.*)?\)|<img\s+[^>]*src=[\"'"'"'][^\"'"'"']+\.(png|webp|jpg|jpeg)(\?.*)?[\"'"'"']|https://github\.com/user-attachments/assets/[a-f0-9\-]+|https://user-images\.githubusercontent\.com/\S+)',
              re.IGNORECASE
          )
          # Specifically check if only .svg was provided
          has_svg_only = ('.svg' in body.lower()) and not bool(pattern.search(body))
          if has_svg_only:
              print('❌ ERROR: Format .svg tidak diperbolehkan sebagai screenshot!')
              print('Gunakan screenshot raster riil: .png, .webp, atau .jpg/.jpeg.')
              sys.exit(1)

          has_valid_img = bool(pattern.search(body)) and 'url_gambar_kamu_disini' not in body
          if has_valid_img:
              print('✅ Valid visual evidence (.png/.webp/.jpg) detected in PR description.')
              sys.exit(0)
          else:
              print('❌ ERROR: PR wajib melampirkan screenshot riil (.png, .webp, atau .jpg/.jpeg)!')
              print('Silakan upload gambar ke deskripsi PR (drag-and-drop file gambar), lalu rerun.')
              sys.exit(1)
          "

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build -o /dev/null ./cmd/api
      - run: go test ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund --fetch-retries=5 --fetch-timeout=120000
      - run: npm run build
