name: Build and push arm64 images

# Terpisah dari docker-publish.yml dengan sengaja: kalau build arm64 gagal di
# workflow utama, job `deploy` (needs: images) ikut ke-skip dan prod berhenti
# ke-deploy. Di sini nggak ada job deploy, jadi gagal = cuma gagal, nggak
# nyentuh apa pun yang sudah jalan.
#
# Hasilnya tag sendiri (`:arm64`), bukan `:latest` — `:latest` tetap milik
# jalur amd64/prod, jadi nggak ada rebutan tag antar workflow.
on:
  workflow_dispatch:
  push:
    branches: [coolify]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-publish-arm64.yml"

env:
  REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            file: ./backend/Dockerfile
          - name: web
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.name }} (arm64)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/artracker-${{ matrix.name }}:arm64
            ${{ env.REGISTRY_USER }}/artracker-${{ matrix.name }}:arm64-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}-arm64
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-arm64
