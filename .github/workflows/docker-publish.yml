name: Build and push images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}

jobs:
  images:
    # off until the Docker Hub secrets exist; enable with repo variable
    # PUBLISH_IMAGES=true (Settings -> Variables)
    if: vars.PUBLISH_IMAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./backend
            file: ./backend/Dockerfile
          - name: web
            context: ./frontend
            file: ./frontend/Dockerfile
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY_USER }}/artracker-${{ matrix.name }}:latest
            ${{ env.REGISTRY_USER }}/artracker-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Deploys on every push to main. Works in two modes:
  #  - Docker Hub images available  -> pull + up
  #  - not published yet            -> build on the VPS (BUILD_FALLBACK)
  deploy:
    needs: images
    if: always() && vars.DEPLOY_ENABLED == 'true' && needs.images.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Update the stack on the VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/artracker
            git fetch --prune origin
            git reset --hard origin/main
            if docker compose -f docker-compose.prod.yml pull --quiet; then
              echo "images pulled from registry"
              docker compose -f docker-compose.prod.yml up -d --remove-orphans
            else
              echo "registry images unavailable - building on host"
              docker compose -f docker-compose.prod.yml -f docker-compose.build.yml up -d --build
            fi
            docker image prune -f
            docker compose -f docker-compose.prod.yml ps
